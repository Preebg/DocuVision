[package]
name = "docuvision"
version = "0.1.0"
description = "DocuVision desktop shell (Tauri) for the local verification SPA"
authors = ["DocuVision"]
edition = "2021"

[lib]
name = "docuvision_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
