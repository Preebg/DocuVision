# DocuVision local air-gapped stack
#
# Worker (pipeline):  docker compose up --build worker
# Ingestion daemon:   docker compose up --build ingestion
# API + static UI:    docker compose up --build api web
# Full stack:         docker compose up --build
# With local Ollama:  docker compose --profile ollama up --build
#
# Scanner / NFS drops: configure paths in config/ingestion_sources.yaml
# (mounted read-only). The ingestion service moves files into /data/incoming
# as Migration 002 batches; the worker claims queued jobs from there.
# Point DOCUVISION_OLLAMA_BASE_URL at your Mini PC or host Ollama.
# SPA talks to FastAPI via NEXT_PUBLIC_API_BASE_URL (browser-reachable host).

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/data
    environment:
      DOCUVISION_DATA_ROOT: /data
      DOCUVISION_DATABASE_URL: ${DOCUVISION_DATABASE_URL:-}
      DOCUVISION_OLLAMA_BASE_URL: ${DOCUVISION_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DOCUVISION_OLLAMA_PRIMARY_MODEL: ${DOCUVISION_OLLAMA_PRIMARY_MODEL:-qwen3-vl:8b-thinking}
      DOCUVISION_OLLAMA_FALLBACK_MODEL: ${DOCUVISION_OLLAMA_FALLBACK_MODEL:-qwen2.5vl:3b}
      DOCUVISION_OLLAMA_WARMUP: ${DOCUVISION_OLLAMA_WARMUP:-true}
      DOCUVISION_WATCHER_POLL_INTERVAL_SECONDS: ${DOCUVISION_WATCHER_POLL_INTERVAL_SECONDS:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "run_ingestion.py"]
    volumes:
      - ./data:/data
      - ./config/ingestion_sources.yaml:/app/config/ingestion_sources.yaml:ro
      # Bind host scanner / NFS mounts declared in ingestion_sources.yaml, e.g.:
      # - /mnt/clinic_records:/mnt/clinic_records
      # - ./data/drops:/data/drops
      - ./data/drops:/data/drops
      - ./data/quarantine:/data/quarantine
    environment:
      DOCUVISION_DATA_ROOT: /data
      DOCUVISION_DATABASE_URL: ${DOCUVISION_DATABASE_URL:-}
      DOCUVISION_INGESTION_SOURCES_PATH: /app/config/ingestion_sources.yaml
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "run_api.py"]
    volumes:
      - ./data:/data
      - ./config/ingestion_sources.yaml:/app/config/ingestion_sources.yaml:ro
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DOCUVISION_DATA_ROOT: /data
      DOCUVISION_DATABASE_URL: ${DOCUVISION_DATABASE_URL:-}
      DOCUVISION_API_CORS_ORIGINS: ${DOCUVISION_API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,tauri://localhost}
      DOCUVISION_INGESTION_SOURCES_PATH: /app/config/ingestion_sources.yaml
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
